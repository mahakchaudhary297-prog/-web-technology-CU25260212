<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Form Validation</title>
    <style>
        body { font-family: Arial; background: #f2f2f2; padding: 20px; }
        .form-box { width: 380px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input { width: 100%; padding: 7px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .error { color: red; font-size: 13px; margin-top: 2px; display: block; }
        button { background: #28a745; color: white; border: none; padding: 10px 15px; width: 100%; margin-top: 15px; border-radius: 4px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

<div class="form-box">
    <h2>Registration & Validation</h2>
    <form id="regForm" onsubmit="return validateForm()">
        <label>Name:</label>
        <input type="text" id="name">
        <span id="nameError" class="error"></span>

        <label>Email:</label>
        <input type="text" id="email">
        <span id="emailError" class="error"></span>

        <label>Mobile Number:</label>
        <input type="text" id="mobile">
        <span id="mobileError" class="error"></span>

        <label>Password:</label>
        <input type="password" id="password">
        <span id="passError" class="error"></span>

        <label>Age:</label>
        <input type="number" id="age">
        <span id="ageError" class="error"></span>

        <button type="submit">Register</button>
    </form>
</div>

<script>
    function validateForm() {
        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value.trim();
        let mobile = document.getElementById("mobile").value.trim();
        let password = document.getElementById("password").value;
        let age = document.getElementById("age").value;

        let isValid = true;

        // Name Validation
        if (name === "") {
            document.getElementById("nameError").innerText = "Name is required.";
            isValid = false;
        } else {
            document.getElementById("nameError").innerText = "";
        }

        // Email Validation
        let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
        if (!email.match(emailPattern)) {
            document.getElementById("emailError").innerText = "Enter a valid email address.";
            isValid = false;
        } else {
            document.getElementById("emailError").innerText = "";
        }

        // Mobile Number Validation (10 digits)
        let mobilePattern = /^[0-9]{10}$/;
        if (!mobile.match(mobilePattern)) {
            document.getElementById("mobileError").innerText = "Enter a valid 10-digit mobile number.";
            isValid = false;
        } else {
            document.getElementById("mobileError").innerText = "";
        }

        // Password Validation (at least 6 characters)
        if (password.length < 6) {
            document.getElementById("passError").innerText = "Password must be at least 6 characters.";
            isValid = false;
        } else {
            document.getElementById("passError").innerText = "";
        }

        // Age Validation
        if (age === "" || age < 18 || age > 100) {
            document.getElementById("ageError").innerText = "Age must be between 18 and 100.";
            isValid = false;
        } else {
            document.getElementById("ageError").innerText = "";
        }

        return isValid; // Prevents form submission if any validation fails
    }
</script>

</body>
</html>
