<!DOCTYPE html>
<html>
<head>
    <title>College Website - Frames</title>
</head>
<frameset rows="20%, 80%" border="1">
    <!-- Top Frame for Header -->
    <frame src="header.html" name="headerFrame">
    
    <!-- Nested Frameset for Navigation and Main Content -->
    <frameset cols="25%, 75%">
        <!-- Left Frame for Navigation Menu -->
        <frame src="nav.html" name="navFrame">
        <!-- Right Frame for Main Dynamic Content -->
        <frame src="home.html" name="mainFrame">
    </frameset>
</frameset>
</html>
