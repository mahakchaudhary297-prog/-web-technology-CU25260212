<!DOCTYPE html>
<html>
<head>
    <title>Login & Admission Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f3; padding: 20px; }
        .container { width: 450px; margin: 20px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #003366; text-align: center; border-bottom: 2px solid #003366; padding-bottom: 8px; }
        label { display: block; margin-top: 12px; font-weight: bold; color: #333; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #003366; color: white; border: none; padding: 10px 18px; margin-top: 15px; border-radius: 4px; cursor: pointer; font-size: 15px; width: 100%; }
        button:hover { background-color: #002244; }
    </style>
</head>
<body>

    <!-- Login Form -->
    <div class="container">
        <h2>User Login</h2>
        <form>
            <label>Username / Email:</label>
            <input type="text" required placeholder="Enter username">

            <label>Password:</label>
            <input type="password" required placeholder="Enter password">

            <button type="submit">Login</button>
        </form>
    </div>

    <!-- College Admission Form -->
    <div class="container">
        <h2>College Admission Form</h2>
        <form>
            <label>Full Name:</label>
            <input type="text" required>

            <label>Email Address:</label>
            <input type="email" required>

            <label>Select Desired Course:</label>
            <select>
                <option>B.Tech Computer Science</option>
                <option>BBA (Management)</option>
                <option>B.Sc. Information Technology</option>
            </select>

            <label>Address:</label>
            <textarea rows="3"></textarea>

            <button type="submit">Submit Application</button>
        </form>
    </div>

</body>
</html>
